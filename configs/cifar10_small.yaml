#  A laptop-sized CIFAR-10 config, meant to train in roughly ten minutes on
#  an Apple Silicon GPU while still reaching non-trivial verified robust
#  accuracy (VRA), so the certification machinery can actually be studied.
#
#  Device-agnostic: use it with --device cpu, mps or cuda.
#
#  It will NOT reproduce the accuracy in the README: the model is far smaller,
#  it trains for 30 epochs instead of 800, and `use_ddpm` is off (the
#  diffusion-generated augmentation data is not distributed with this repo --
#  see tools/dataset/make_ddpm_npz.py).
#
#  The `gloro` block is left exactly as in cifar10.yaml. Validation VRA is
#  measured at `eps` directly, not at the ramped training radius, so the
#  reported number stays comparable to the README's VRA@36/255 column.

model:
    depth: 6          # conv trunk depth
    width: 64         # mid_dim = width * (feature_size // 4)**2 = 64 * 16
    out_dim: 256      # must be even and <= mid_dim (1024 here)
    mlp_depth: 4
    use_lln: True
    num_lc_iter: 5
    act_name: 'MinMax'

training:
    batch_size: 256
    epochs: 30
    warmup_epochs: 2
    lr: 0.001
    weight_decay: 0.0
    grad_clip: True
    grad_clip_val: 3
    nadam: True
    lookahead: True
    use_ddpm: False

dataset:
    name: 'cifar10'
    num_classes: 10
    input_size: 32

gloro:
    eps: 0.1411764705882353
    min_eps: 0.1
    max_eps: 3.0
    loss_type: 'emma_loss'
